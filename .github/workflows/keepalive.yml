# Penjaga anti-jeda TIS
# Setiap 3 hari mengirim satu permintaan kecil ke Supabase supaya proyek
# gratis tidak dijeda (pause) karena tidak ada aktivitas, misalnya saat libur.
# Tidak menyimpan atau mengubah data apa pun.
name: Jaga Supabase tetap aktif

on:
  schedule:
    - cron: "17 1 */3 * *"   # setiap 3 hari, pukul 08.17 WIB
  workflow_dispatch:          # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false
      - name: Ping Supabase
        run: |
          node -e '
            global.window={}; eval(require("fs").readFileSync("config.js","utf8"));
            const c=window.TIS_CONFIG||{};
            if(!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY){ console.log("config.js kosong (mode demo), tidak ada yang di-ping."); process.exit(0); }
            fetch(c.SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/seasons?select=id&limit=1",{headers:{apikey:c.SUPABASE_ANON_KEY,Authorization:"Bearer "+c.SUPABASE_ANON_KEY}})
              .then(r=>{ console.log("Supabase menjawab: HTTP "+r.status); if(r.status>=500) process.exit(1); })
              .catch(e=>{ console.error("Gagal menghubungi Supabase:",e.message); process.exit(1); });
          '
